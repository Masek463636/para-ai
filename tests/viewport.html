<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PARA — проверка ширины</title><style>body{margin:0;background:#24212a;color:white;font:14px system-ui}nav{padding:12px;display:flex;gap:12px;align-items:center}button{padding:10px;border-radius:8px;border:0}iframe{display:block;height:820px;border:0;margin:0 auto;background:#09060f;max-width:100%}p{margin:8px 12px;color:#ccc}a{color:#ecbfff}</style></head><body><nav aria-label="Тестовые размеры"><button data-width="375">375 px</button><button data-width="390">390 px</button><button data-width="430">430 px</button><a href="/">Открыть сайт</a></nav><p id="width">375 px · обычный браузер, не эмуляция iOS</p><iframe id="app" title="PARA при ширине телефона" src="/" width="375"></iframe><script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>{document.querySelector('iframe').width=button.dataset.width;document.querySelector('#width').textContent=button.dataset.width+' px · обычный браузер, не эмуляция iOS';});</script></body></html>
